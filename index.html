<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NurseFlow 시제품</title>
<script>
/* 서버 주소: 따옴표 안의 글자를 /exec로 끝나는 주소로 바꾸세요 */
var API_URL = '여기에_서버_주소';
window.onerror = function (msg, src, line) {
  var b = document.getElementById('errBox');
  if (b) { b.style.display = 'block'; b.textContent = '오류: ' + msg + ' (줄 ' + line + ') - 이 화면을 캡처해 보내 주세요.'; }
};
</script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,'Malgun Gothic',sans-serif;background:#f2f4f7;font-size:16px;color:#222}
header{background:#1f5f8b;color:#fff;padding:8px 12px;position:sticky;top:0;z-index:5}
header button{padding:6px 10px;font-size:14px}
.sub{font-size:13px;opacity:.9;margin-top:4px}
main{padding:12px;max-width:640px;margin:auto;padding-bottom:60px}
.card{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h3{margin:2px 0 10px;font-size:16px;color:#1f5f8b}
button{font-size:16px;padding:10px 14px;border:0;border-radius:8px;background:#1f5f8b;color:#fff;margin:3px}
button.sec{background:#e3e8ee;color:#222}
button.warn{background:#c0392b;color:#fff}
button.big{width:100%;padding:14px;margin:8px 0}
input,select{font-size:16px;padding:8px;border:1px solid #bbb;border-radius:6px;width:100%;background:#fff}
input.sm{width:100px}
input[type=checkbox]{width:22px;height:22px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row label{min-width:90px}
.chips button{background:#e3e8ee;color:#222;padding:8px 10px}
.chips button.on{background:#1f5f8b;color:#fff}
.red{color:#c0392b!important;border-color:#c0392b!important;font-weight:bold}
.muted{color:#777;font-size:13px}
.del{text-decoration:line-through;color:#999}
.tabs{display:flex;gap:4px;margin:8px 0}
.tabs button{flex:1;background:#e3e8ee;color:#222;margin:0}
.tabs button.on{background:#1f5f8b;color:#fff}
.pt{cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10;align-items:center;justify-content:center}
#modal .box{background:#fff;border-radius:12px;padding:16px;width:94%;max-width:500px;max-height:88vh;overflow:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:30;max-width:90%}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;z-index:25;align-items:center;justify-content:center;font-size:18px}
.demo{background:#e67e22;color:#fff;text-align:center;font-size:13px;padding:4px;display:none}
#errBox{display:none;background:#c0392b;color:#fff;padding:10px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid #eee;padding:6px 4px;text-align:left}
td.n,th.n{text-align:right}
</style>
</head>
<body>
<div id="errBox"></div>
<div id="demoBar" class="demo"></div>
<header id="hdr"><b>NurseFlow</b></header>
<main id="main"><div class="card">앱을 불러오는 중입니다. 이 문구가 계속 보이면 코드가 일부 빠졌을 수 있습니다.</div></main>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="busy">처리 중…</div>
<div id="toast"></div>
<script>
/* ===== 1. 기본 도구 ===== */
var S = { user: null, data: null, view: 'login', reg: null, tab: 'in', lastLoad: 0, slots: [] };
var DIET = [['d_rice', '밥'], ['d_soup', '국'], ['d_side', '반찬']];
var RATIO = ['0', '1/4', '1/3', '1/2', '2/3', '3/4', '전량', '기타'];
var VS = [['SBP', 'mmHg'], ['DBP', 'mmHg'], ['HR', '회/분'], ['BT', '°C'], ['RR', '회/분'], ['SpO2', '%']];
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function js(v) { return esc(JSON.stringify(String(v))); }
var LS = {
  get: function (k, d) { try { var v = localStorage.getItem('nf_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { localStorage.setItem('nf_' + k, JSON.stringify(v)); },
  del: function (k) { localStorage.removeItem('nf_' + k); }
};
function toast(t) { var e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.display = 'none'; }, 3500); }
function busy(on) { $('busy').style.display = on ? 'flex' : 'none'; }
function modal(h) { $('mbox').innerHTML = h; $('modal').style.display = 'flex'; }
function closeModal() { stopScan(); $('modal').style.display = 'none'; }
async function run(fn) { busy(true); try { await fn(); } catch (e) { alert(e.message || e); } finally { busy(false); } }
function val(el) { var v = String(el.value).trim(); if (v === '') return null; var n = Number(v); if (isNaN(n) || n < 0) throw new Error('숫자가 올바르지 않습니다: ' + v); return n; }

/* ===== 2. 시각과 I/O 구간 ===== */
function pad(n) { return (n < 10 ? '0' : '') + n; }
function now() { return new Date(Date.now() + LS.get('offset', 0)); }
function fmt(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtD(d) { return fmt(d).slice(0, 10); }
function parse(s) { var m = String(s || '').match(/(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})/); return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]) : null; }
function addDays(ds, n) { var p = ds.split('-'); return fmtD(new Date(+p[0], p[1] - 1, +p[2] + n)); }
function mins(hm) { var p = String(hm).split(':'); return (+p[0]) * 60 + (+p[1]); }
function addMin(hm, n) { var m = ((mins(hm) + n) % 1440 + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
function dtl(s) { return String(s).replace(' ', 'T'); }
function fromDtl(v) { return String(v || '').replace('T', ' ').slice(0, 16); }
function setg(k) { return S.data.settings[k]; }
function cut(d, b) {
  var m = d.getHours() * 60 + d.getMinutes(), ds = fmtD(d);
  if (m < mins(b.Day)) return { date: addDays(ds, -1), name: 'Night' };
  if (m < mins(b.Eve)) return { date: ds, name: 'Day' };
  if (m < mins(b.Night)) return { date: ds, name: 'Eve' };
  return { date: ds, name: 'Night' };
}
function ioOf(d) { var c = cut(d, setg('io')); return { ioDate: c.date, period: c.name }; }
function shiftId() { var c = cut(now(), setg('shift')); return c.date + ' ' + c.name; }
function since() { return addDays(ioOf(now()).ioDate, -1); }
function inRange(t) { var d = parse(t); return !!d && ioOf(d).ioDate >= since(); }

/* ===== 3. 서버 통신 ===== */
function apiUrl() { return /^https:\/\//.test(API_URL) ? API_URL : LS.get('api', ''); }
async function api(action, body, by) {
  if (!apiUrl()) throw new Error('서버 주소가 없습니다.');
  var q = Object.assign({ action: action, by: by || (S.user ? S.user.empId : '') }, body || {});
  var res = await fetch(apiUrl(), { method: 'POST', body: JSON.stringify(q) });
  var j;
  try { j = await res.json(); } catch (e) { throw new Error('서버 응답을 읽지 못했습니다. 서버 주소와 배포 상태를 확인하세요.'); }
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
async function reload() {
  S.data = await api('bootstrap', { since: addDays(fmtD(now()), -3) });
  S.user = S.data.user; S.lastLoad = Date.now();
}
async function sendRecords(recs) {
  try { await api('addRecords', { records: recs }); toast('저장했습니다 (EMR 전송 완료)'); }
  catch (e) {
    if (e instanceof TypeError) {
      var q = LS.get('queue', []); q.push({ by: S.user.empId, records: recs }); LS.set('queue', q);
      toast('네트워크 오류: 전송 대기로 보관했습니다. 연결되면 자동으로 보냅니다.');
    } else throw e;
  }
}
var flushing = false;
async function flushQueue(manual) {
  var q = LS.get('queue', []);
  if (flushing || !q.length) { if (manual === true) toast('보낼 기록이 없습니다.'); return; }
  flushing = true; var rest = [], ok = 0;
  for (var i = 0; i < q.length; i++) {
    try { await api('addRecords', { records: q[i].records }, q[i].by); ok++; }
    catch (e) {
      if (e instanceof TypeError) rest.push(q[i]);
      else { var f = LS.get('failed', []); f.push({ time: fmt(now()), error: e.message }); LS.set('failed', f); }
    }
  }
  LS.set('queue', rest); flushing = false;
  if (ok) {
    toast('전송 대기 ' + ok + '건을 보냈습니다.');
    if (S.user) { try { await reload(); } catch (e) {} if (S.view === 'home') renderHome(); }
  }
}

/* ===== 4. 데이터 도구 ===== */
function pat(reg) { return S.data.patients.find(function (p) { return p.regNo === reg; }); }
function cfg(p) { try { return JSON.parse(p.config) || {}; } catch (e) { return {}; } }
function owner(reg) { var a = S.data.assign.find(function (x) { return x.regNo === reg; }); return a ? a.empId : ''; }
function isMine(reg) { return owner(reg) === S.user.empId; }
function uname(id) { var u = S.data.users.find(function (x) { return x.empId === id; }); return u ? u.name : id; }
function pLabel(p) { return (p.room ? p.room + '호 ' : '') + (p.name ? p.name + ' ' : '') + p.regNo; }
function recsOf(reg) { return S.data.records.filter(function (r) { return r.regNo === reg; }); }
function fluid(id) { return S.data.fluids.find(function (f) { return f.id === id; }); }
function left(f) { return Number(f.volume) - S.data.records.filter(function (r) { return r.fluidId === f.id && r.status === 'active'; }).reduce(function (a, r) { return a + Number(r.value); }, 0); }
function liveFluids(reg, kind) { return S.data.fluids.filter(function (f) { return f.regNo === reg && f.status === '진행' && f.kind === kind; }); }
function needReview(f) { return f.kind === '일반' && left(f) > 0 && (f.reviewDate || '') < ioOf(now()).ioDate; }
function sums(reg, ioDate, period) {
  var s = { i: 0, o: 0, c: {} };
  recsOf(reg).forEach(function (r) {
    if (r.status !== 'active' || r.ioDate !== ioDate || (period && r.period !== period)) return;
    var v = Number(r.value);
    if (r.cat === '섭취' && r.unit === 'ml') s.i += v;
    if (r.cat === '배설' && (r.unit === 'ml' || r.unit === 'g')) s.o += v;
    if (r.unit === '회') { var k = r.item + (r.sub ? '(' + r.sub + ')' : ''); s.c[k] = (s.c[k] || 0) + v; }
  });
  return s;
}
function mk(reg, cat, item, sub, value, unit, t, extra) {
  var io = ioOf(parse(t));
  return Object.assign({ regNo: reg, cat: cat, item: item, sub: sub || '', value: String(value), unit: unit, recordTime: t,
    ioDate: io.ioDate, period: io.period, fluidId: '', slot: '', status: 'active' }, extra || {});
}

/* ===== 5. 공통 화면 요소 ===== */
function hdr(title, back) {
  var q = LS.get('queue', []).length, f = LS.get('failed', []).length;
  $('hdr').innerHTML = '<div class="row" style="margin:0;justify-content:space-between">' +
    (back ? '<button class="sec" onclick="' + back + '">← 뒤로</button>' : '<b>NurseFlow</b>') +
    '<span><button class="sec" onclick="showAlog()">🔔</button><button class="sec" onclick="renderSettings()">설정</button>' +
    '<button class="sec" onclick="logout()">사용자 전환</button></span></div>' +
    '<div class="sub">' + esc(S.user.name) + ' (' + esc(S.user.empId) + ') · ' + esc(title) + ' · I/O ' + ioOf(now()).period +
    ' 구간 · <span id="clock">' + fmt(now()).slice(11) + '</span>' + (q ? ' · 전송 대기 ' + q + '건' : '') + (f ? ' · 전송 실패 ' + f + '건' : '') + '</div>';
}
function chips(hid, opts, def, flags) {
  flags = flags || '';
  return '<input type="hidden" id="' + hid + '" data-d="' + hid + '" data-def="' + esc(def || '') + '" value="' + esc(def || '') + '"' +
    (flags.indexOf('other') >= 0 ? ' data-other="1"' : '') + (flags.indexOf('toggle') >= 0 ? ' data-toggle="1"' : '') + '>' +
    '<span class="chips" data-for="' + hid + '">' + opts.map(function (o) {
      return '<button type="button" data-v="' + esc(o) + '" onclick="pick(' + js(hid) + ',' + js(o) + ')">' + esc(o) + '</button>';
    }).join('') + '</span>';
}
function pick(hid, v) {
  var e = $(hid);
  if (v === '기타' && e.dataset.other) { var x = prompt('직접 입력하세요 (예: 1/5)', ''); if (x === null || !x.trim()) return; v = x.trim(); }
  else if (e.value === v && e.dataset.toggle) v = '';
  e.value = v; afterInput();
}
function updChips() {
  document.querySelectorAll('.chips[data-for]').forEach(function (box) {
    var v = $(box.dataset.for).value, list = [].map.call(box.children, function (b) { return b.dataset.v; });
    [].forEach.call(box.children, function (b) {
      var on = b.dataset.v === v || (b.dataset.v === '기타' && v && list.indexOf(v) < 0);
      b.className = on ? 'on' : '';
      if (b.dataset.v === '기타') b.textContent = (on && v !== '기타') ? '기타: ' + v : '기타';
    });
  });
}
function afterInput() {
  updChips();
  if ($('dres')) calcDiaper();
  if ($('vs_SBP')) vsColor();
  if ($('vsOtherBox')) $('vsOtherBox').style.display = $('vst').value === '기타' ? 'flex' : 'none';
  if ($('af_kind')) {
    var mix = $('af_kind').value !== '일반 수액', once = $('af_mode').value === '일회';
    $('af_mix').style.display = mix ? 'block' : 'none';
    $('af_rep').style.display = once ? 'none' : 'block';
    $('af_once').style.display = once ? 'flex' : 'none';
  }
}
function timeCard() {
  return '<div class="card"><div class="row"><label>기록 시각</label><input type="datetime-local" id="recTime" data-d="t" value="' + dtl(fmt(now())) + '" style="flex:1" onchange="afterInput()">' +
    '<button class="sec" onclick="$(\'recTime\').value=dtl(fmt(now()));afterInput()">지금</button></div>' +
    '<div class="muted">누락 기록은 시각을 바꿔 추가하세요. 가능 범위: ' + since() + ' ' + setg('io').Day + ' 이후</div></div>';
}
function recTime() {
  var t = fromDtl($('recTime').value);
  if (!parse(t)) throw new Error('기록 시각을 입력하세요.');
  if (!inRange(t)) throw new Error('직전 I/O 하루보다 이전 시각은 기록할 수 없습니다.');
  return t;
}

/* ===== 6. 로그인 · 회원가입 ===== */
function renderLogin() {
  S.view = 'login'; S.user = null;
  $('hdr').innerHTML = '<b>NurseFlow 시제품</b><div class="sub">간호 I/O·V/S 기록 (가상 환자 전용)</div>';
  var h = '';
  if (!apiUrl()) h += '<div class="card"><h3>서버 주소 입력 (처음 1번)</h3><input id="apiIn" placeholder="https://script.google.com/macros/s/…/exec">' +
    '<button class="big" onclick="saveApi()">저장</button></div>';
  h += '<div class="card"><h3>로그인</h3><input id="emp" placeholder="사번" autocomplete="off" autocapitalize="off">' +
    '<button class="big" onclick="doLogin()">로그인</button><button class="sec big" onclick="renderRegister()">회원가입</button></div>';
  $('main').innerHTML = h;
}
function saveApi() {
  var v = $('apiIn').value.trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)) { alert('/exec로 끝나는 서버 주소를 넣어 주세요.'); return; }
  LS.set('api', v); renderLogin();
}
function doLogin() { var id = $('emp').value.trim(); if (id) { unlockAudio(); login(id, false); } }
async function login(empId, restore) {
  if (!apiUrl()) { renderLogin(); return; }
  busy(true);
  try { S.data = await api('bootstrap', { since: addDays(fmtD(now()), -3) }, empId); S.user = S.data.user; S.lastLoad = Date.now(); }
  catch (e) { busy(false); LS.del('session'); renderLogin(); if (!restore) alert(e.message); return; }
  busy(false);
  var s = LS.get('session', null), sid = shiftId();
  if (restore && (!s || s.shift !== sid)) { LS.del('session'); renderLogin(); toast('근무 교대 시각이 지나 로그아웃되었습니다.'); return; }
  LS.set('session', { empId: empId, shift: sid });
  var d = LS.get('draft_' + empId, null);
  if (d && pat(d.reg)) {
    LS.del('draft_' + empId); S.reg = d.reg; S.tab = d.tab; renderPatient();
    Object.keys(d.vals).forEach(function (k) { var e = document.querySelector('#main [data-d="' + k + '"]'); if (e) e.value = d.vals[k]; });
    afterInput(); toast('임시 보관된 입력을 불러왔습니다. 확인 후 저장하세요.'); return;
  }
  renderHome();
}
function renderRegister() {
  $('main').innerHTML = '<div class="card"><h3>회원가입</h3>' +
    '<div class="row"><label>직종</label><select id="rJob"><option>간호사</option></select></div>' +
    '<div class="row"><label>사번</label><input id="rEmp" autocapitalize="off"></div>' +
    '<div class="row"><label>이름</label><input id="rName"></div>' +
    '<button class="big" onclick="doRegister()">가입 요청</button><button class="sec big" onclick="renderLogin()">취소</button>' +
    '<p class="muted">수간호사가 승인하면 로그인할 수 있습니다.</p></div>';
}
function doRegister() {
  var e = $('rEmp').value.trim(), n = $('rName').value.trim();
  if (!e || !n) { alert('사번과 이름을 입력하세요.'); return; }
  run(async function () { await api('register', { empId: e, name: n, job: $('rJob').value }, e); alert('가입 요청을 보냈습니다. 수간호사 승인 후 로그인하세요.'); renderLogin(); });
}
function saveDraft() {
  if (!S.user || S.view !== 'patient') return;
  var vals = {}, any = false;
  document.querySelectorAll('#main [data-d]').forEach(function (e) {
    vals[e.dataset.d] = e.value;
    if (e.dataset.d !== 't' && e.value !== (e.dataset.def || '')) any = true;
  });
  if (any) LS.set('draft_' + S.user.empId, { reg: S.reg, tab: S.tab, vals: vals });
}
function logout(auto) {
  saveDraft(); closeModal(); S.user = null; S.data = null; LS.del('session'); renderLogin();
  if (auto === true) toast('근무 교대 시각입니다. 자동 로그아웃되었습니다.');
}

/* ===== 7. 홈 · 바코드 ===== */
function renderHome() {
  S.view = 'home'; S.reg = null; hdr('홈');
  var io = ioOf(now());
  var mine = S.data.patients.filter(function (p) { return isMine(p.regNo); });
  var others = S.data.patients.filter(function (p) { return !isMine(p.regNo); });
  var h = '<button class="big" onclick="scanThen(openOrSetup)">📷 환자 바코드 촬영</button>';
  h += '<div class="card"><h3>내 담당 환자 (' + mine.length + '명)</h3>';
  if (!mine.length) h += '<p class="muted">담당 환자가 없습니다. 바코드를 촬영해 환자를 열고 "담당으로 지정"을 누르세요.</p>';
  mine.forEach(function (p) {
    var s = sums(p.regNo, io.ioDate, io.period), gen = liveFluids(p.regNo, '일반');
    var nf = gen.filter(function (f) { return left(f) > 0; }).length, rv = gen.some(needReview);
    h += '<div class="card pt" style="background:#f7fafc" onclick="openPatient(' + js(p.regNo) + ')"><b>' + esc(pLabel(p)) + '</b>' +
      '<div class="muted">' + io.period + ' 구간 섭취 ' + s.i + 'ml · 배설 ' + s.o + 'ml' + (nf ? ' · 진행 수액 ' + nf + '개' : '') + '</div>' +
      (rv ? '<div class="red">06:00 수액 재설정 필요</div>' : '') + '</div>';
  });
  h += '</div>';
  if (others.length) {

    if (d.id === 'mid' && flu.length) msgs.push(['AL-05', '중간수액량을 확인하세요', flu]);
    if (d.id === 'review' && rev.length) msgs.push(['AL-04', '수액을 확인한 뒤 계속 투여/종료를 고르고 새 수액을 세팅하세요', rev]);
  });
  if (msgs.length) showAlert(msgs);
}
function showAlert(msgs) {
  stopScan(); beep();
  var t = fmt(now()), log = LS.get('alog_' + S.user.empId, []), h = '<h3>🔔 알림 · ' + t.slice(11) + '</h3>';
  msgs.forEach(function (m) {
    h += '<div class="card" style="background:#fff7e6"><b>' + esc(m[1]) + '</b> <span class="muted">' + m[0] + '</span>' + m[2].map(function (p) {
      return '<div class="row pt" onclick="closeModal();openPatient(' + js(p.regNo) + ')">' + esc(S.user.name) + ' 간호사 담당 – ' + esc(pLabel(p)) + ' ›</div>'; }).join('') + '</div>';
    log.unshift({ t: t, id: m[0], msg: m[1], pts: m[2].map(function (p) { return pLabel(p); }).join(', ') });
  });
  LS.set('alog_' + S.user.empId, log.slice(0, 50));
  modal(h + '<button class="big" onclick="closeModal()">확인</button>');
}
function showAlog() {
  var log = LS.get('alog_' + S.user.empId, []);
  modal('<h3>알림 기록</h3>' + (log.length ? log.map(function (a) {
    return '<div class="card"><b>' + esc(a.t) + ' ' + esc(a.id) + '</b><div>' + esc(a.msg) + '</div><div class="muted">' + esc(a.pts) + '</div></div>'; }).join('')
    : '<p class="muted">알림이 없습니다.</p>') + '<button class="big" onclick="closeModal()">닫기</button>');
}

/* ===== 16. 시작 · 주기 확인 ===== */
function tick() {
  var off = LS.get('offset', 0), bar = $('demoBar');
  bar.style.display = off ? 'block' : 'none'; if (off) bar.textContent = '시연 모드 · 앱 시각 ' + fmt(now());
  if (!S.user || !S.data) return;
  var s = LS.get('session', {});
  if (s.shift && s.shift !== shiftId()) { logout(true); return; }
  var c = $('clock'); if (c) c.textContent = fmt(now()).slice(11);
  checkAlerts(); flushQueue();
  if (S.view === 'home' && Date.now() - S.lastLoad > 60000) reload().then(function () { if (S.view === 'home' && S.user) renderHome(); }).catch(function () {});
}
setInterval(tick, 15000);
(function () { var s = LS.get('session', null); if (s && apiUrl()) login(s.empId, true); else renderLogin(); tick(); })();
</script>
